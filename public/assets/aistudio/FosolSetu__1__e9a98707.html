<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FosolSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eddc;--card:#fbfcf6;--ink:#17261a;--mut:#506050;--g:#14532d;--g2:#d4e8d0;--gold:#c8952b;--g3:#f4e3b8;--soil:#5a3e2b;--bd:#b9c4a6;--bad:#a32119;--bad2:#f6d8d4;--onG:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a12;--card:#1a271c;--ink:#eef3e6;--mut:#a9b8a3;--g:#6fcf8b;--g2:#23412b;--gold:#e5b44f;--g3:#3d3418;--soil:#d9b896;--bd:#35493a;--bad:#ff8f84;--bad2:#4a211d;--onG:#0b1a0f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a12;--card:#1a271c;--ink:#eef3e6;--mut:#a9b8a3;--g:#6fcf8b;--g2:#23412b;--gold:#e5b44f;--g3:#3d3418;--soil:#d9b896;--bd:#35493a;--bad:#ff8f84;--bad2:#4a211d;--onG:#0b1a0f;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 17px/1.4 "Hind Siliguri",system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:10}
#app{max-width:480px;margin:0 auto;padding-bottom:84px;min-height:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);color:var(--onG);padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:20px;flex:1}header button{background:transparent;color:inherit;border:2px solid currentColor;border-radius:10px;min-height:40px;padding:0 12px;font:inherit}
main{padding:14px}h2{font-size:22px;margin:4px 0 12px}h3{font-size:18px;margin:0 0 6px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--g);color:var(--onG);font:700 18px "Hind Siliguri",sans-serif;margin:8px 0;cursor:pointer}
.btn.alt{background:var(--g3);color:var(--soil);border:2px solid var(--gold)}.btn.bad{background:var(--bad2);color:var(--bad)}.btn.sm{min-height:48px;width:auto;padding:0 16px;margin:0;flex:1}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select{width:100%;min-height:52px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.g4{grid-template-columns:repeat(4,1fr)}
.tile{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:14px;min-height:84px;padding:8px;font:700 16px "Hind Siliguri",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tile.on{border-color:var(--g);background:var(--g2)}.tile span{font-size:30px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}.row:last-child{border:0}
.mut{color:var(--mut);font-size:15px}.big{font-size:30px;font-weight:700;line-height:1.1}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--g2);color:var(--g)}.pill.w{background:var(--g3);color:var(--soil)}.pill.r{background:var(--bad2);color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;min-height:64px;border:0;background:none;color:var(--mut);font:700 13px "Hind Siliguri",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}nav button span{font-size:24px}nav button.on{color:var(--g);background:var(--g2)}
.bridge{display:flex;align-items:center;margin:4px 0 12px}.bridge i{flex:1;height:5px;background:var(--bd)}.bridge i.d{background:var(--g)}
.bridge b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bd);color:var(--ink);font-size:16px}.bridge b.d{background:var(--g);color:var(--onG)}
.score{width:92px;height:92px;border-radius:50%;border:8px solid var(--g);display:grid;place-items:center;font-size:30px;font-weight:700;flex:none}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:12px;right:12px;max-width:456px;margin:auto;background:var(--soil);color:var(--bg);border-radius:12px;padding:12px 14px;z-index:20;font-weight:700}
.bar{height:16px;border-radius:8px;background:var(--g);margin-top:4px}.bar.s{background:var(--gold)}.bar.t{background:var(--soil)}
svg{width:100%;height:80px;display:block}
</style></head><body><div id="app"></div>
<script>
/* ---------- Data layer: swap these mocks for fetch() calls to a real backend / SMS / weather API ---------- */
const API={
  crops:{rice:{ic:'🌾',en:'Rice',bn:'ধান',h:[1580,1595,1610,1625,1640,1650],f:[1690,1730,1760],y:18,pr:1650},
    jute:{ic:'🌿',en:'Jute',bn:'পাট',h:[3500,3480,3450,3420,3400,3390],f:[3350,3300,3280],y:12,pr:3390},
    potato:{ic:'🥔',en:'Potato',bn:'আলু',h:[880,900,940,980,1010,1040],f:[1000,950,900],y:80,pr:1040},
    tomato:{ic:'🍅',en:'Tomato',bn:'টমেটো',h:[1400,1450,1520,1580,1640,1700],f:[1760,1820,1900],y:100,pr:1700}},
  dists:['Rajshahi','Bogura','Rangpur','Jashore','Munshiganj','Mymensingh','Cumilla'],
  weather:[{ic:'🌧️',s:'r',en:'Heavy rain in 48 hours',bn:'৪৮ ঘণ্টায় ভারী বৃষ্টি',den:'Cover cut crop. Delay spraying.',dbn:'কাটা ফসল ঢেকে রাখুন। স্প্রে পিছিয়ে দিন।'},
    {ic:'💨',s:'w',en:'Strong wind Thursday',bn:'বৃহস্পতিবার জোরে বাতাস',den:'Support tall plants.',dbn:'লম্বা গাছে খুঁটি দিন।'},
    {ic:'☀️',s:'g',en:'Dry, clear weekend',bn:'সপ্তাহান্তে শুকনো আবহাওয়া',den:'Good time to harvest and dry.',dbn:'ফসল কাটা ও শুকানোর ভালো সময়।'}],
  dealers:[{n:'Rahman Agro Store',d:'Bogura',i:'Seed, urea, DAP',f:1},{n:'Shapla Krishi Bhandar',d:'Rajshahi',i:'Pesticide, seed',f:1},{n:'Padma Input Centre',d:'Munshiganj',i:'Fertiliser, tools',f:0},{n:'Jamuna Seeds',d:'Rangpur',i:'Certified seed',f:0}],
  buyers:[{id:'b1',n:'Karim Agro Traders',t:'Wholesaler',d:'Dhaka',ok:1},{id:'b2',n:'Bengal Export Ltd',t:'Exporter',d:'Chattogram',ok:1},{id:'b3',n:'GreenPlate Foods',t:'Processor',d:'Gazipur',ok:1}],
  seedListings:[{id:'s1',farmer:'Abdul Mannan',crop:'potato',qty:200,ask:1020,dist:'Munshiganj',offers:[]},{id:'s2',farmer:'Rahima Begum (women’s co-op)',crop:'tomato',qty:60,ask:1650,dist:'Jashore',offers:[]}],
  mix:{Basic:[1540,75],Pro:[1120,250],Premium:[600,450]},dataRev:85000
};
const S={lang:'bn',role:null,view:'login',plans:[],listings:[],cur:null,sub:'Pro',toast:'',phone:'01712 345678',blist:JSON.parse(JSON.stringify(API.seedListings)),bsel:'b1'};
const L=(en,bn)=>S.lang==='bn'?bn:en,$=id=>document.getElementById(id);
const fmt=n=>'৳'+Math.round(n).toLocaleString('en-IN');
const cn=k=>API.crops[k][S.lang];
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang=S.lang==='bn'?'bn-BD':'en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},2600)}
function go(v){S.view=v;render();scrollTo(0,0)}
function lang(){S.lang=S.lang==='bn'?'en':'bn';render()}
function theme(){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}

/* ---------- Business logic (replace with server calls) ---------- */
function scorePlan(p){let s=60+({rice:14,jute:10,potato:12,tomato:4})[p.crop]+(p.land<=10?6:2)+(API.dists.indexOf(p.dist)%3)*2;return Math.min(95,s)}
function mkOffer(p){const c=API.crops[p.crop],val=p.land*c.y*c.pr;p.score=scorePlan(p);p.pct=p.score>=80?5:p.score>=70?6.5:8;p.adv=Math.round(val*0.3/100)*100;p.fee=Math.round(p.adv*p.pct/100);p.net=p.adv-p.fee;p.rep=p.adv;const d=new Date(p.date);d.setDate(d.getDate()+7);p.repDate=d.toISOString().slice(0,10);p.status='offer';p.est=val}
const guide=k=>{const c=API.crops[k],cur=c.h[c.h.length-1],fc=c.f[2],up=fc>cur*1.04;return{cur,fc,up,pct:Math.round((fc/cur-1)*100)}};
function spark(k){const c=API.crops[k],a=c.h.concat(c.f),mn=Math.min(...a),mx=Math.max(...a),X=i=>10+i*(280/(a.length-1)),Y=v=>70-(v-mn)/(mx-mn||1)*60;
  const h=c.h.map((v,i)=>X(i)+','+Y(v)).join(' '),f=[c.h.length-1].concat([6,7,8]).map(i=>X(i)+','+Y(a[i])).join(' ');
  return`<svg viewBox="0 0 300 80" role="img" aria-label="price trend"><polyline points="${h}" fill="none" stroke="var(--g)" stroke-width="4"/><polyline points="${f}" fill="none" stroke="var(--gold)" stroke-width="4" stroke-dasharray="7 6"/></svg>`}

/* ---------- Actions ---------- */
function login(r){S.phone=$('ph')?$('ph').value:S.phone;S.role=r;go(r==='farmer'?'home':r==='buyer'?'browse':'admin')}
function pick(k){S.pc=k;document.querySelectorAll('.cp').forEach(e=>e.classList.toggle('on',e.dataset.k===k))}
function savePlan(){const p={id:Date.now(),crop:S.pc||'rice',land:+$('land').value||5,dist:$('dist').value,date:$('hd').value,women:$('wm').checked};mkOffer(p);S.plans.push(p);S.cur=p;go('offer')}
function accept(){S.cur.status='active';toast(L('Advance accepted. Money sent to bKash.','অগ্রিম নেওয়া হয়েছে। টাকা বিকাশে পাঠানো হয়েছে।'));go('home')}
function mkListing(){const p=S.plans.find(x=>x.id==$('lp').value)||S.plans[0],c=API.crops[p.crop];
  const l={id:'L'+Date.now(),farmer:L('You','আপনি'),crop:p.crop,qty:+$('qty').value||p.land*c.y,ask:+$('ask').value||c.pr,dist:p.dist,offers:[],plan:p.id,mine:1};
  S.listings.push(l);go('market');
  setTimeout(()=>{l.offers.push({id:'o1',b:API.buyers[0],price:Math.round(l.ask*0.97),qty:l.qty,st:'new'});toast(L('New offer from Karim Agro Traders','কারিম অ্যাগ্রো ট্রেডার্স থেকে নতুন অফার'));},1800);
  setTimeout(()=>{if(l.offers.length<2){l.offers.push({id:'o2',b:API.buyers[1],price:Math.round(l.ask*1.02),qty:Math.round(l.qty*.7),st:'new'});toast(L('New offer from Bengal Export Ltd','বেঙ্গল এক্সপোর্ট লিমিটেড থেকে নতুন অফার'))}},4800)}
function decide(lid,oid,ok){const l=S.listings.find(x=>x.id===lid),o=l.offers.find(x=>x.id===oid);o.st=ok?'accepted':'rejected';if(ok){l.sold=o;const p=S.plans.find(x=>x.id===l.plan);if(p)p.status='repaid'}render()}
function sendOffer(lid,pct){const l=S.blist.find(x=>x.id===lid)||S.listings.find(x=>x.id===lid),b=API.buyers.find(x=>x.id===S.bsel);
  l.offers.push({id:'o'+Date.now(),b,price:Math.round(l.ask*(1-pct/100)),qty:l.qty,st:'new'});toast(L('Offer sent to farmer','কৃষকের কাছে অফার পাঠানো হয়েছে'))}

/* ---------- Views ---------- */
const bridge=()=>{const a=S.plans[0],st=!a?0:a.status==='offer'?1:a.status==='active'?2:3,sold=S.listings.some(l=>l.sold),n=sold?4:st,ic=['🌱','💰','🌤️','🤝'],lb=[L('Plan','পরিকল্পনা'),L('Advance','অগ্রিম'),L('Grow','চাষ'),L('Sell','বিক্রি')];
  return`<div class="bridge">${ic.map((x,i)=>`<b class="${i<n||(i===0&&a)?'d':''}">${x}</b>${i<3?`<i class="${i<n-1?'d':''}"></i>`:''}`).join('')}</div><div class="grid g4 mut" style="text-align:center;margin-top:-8px;margin-bottom:12px;font-size:13px">${lb.map(x=>`<span>${x}</span>`).join('')}</div>`};
const V={};
V.login=()=>`<main><div style="text-align:center;padding:18px 0"><div style="font-size:56px">🌾</div><div class="big" style="color:var(--g)">FosolSetu</div><p class="mut">${L('Farmers should earn before they suffer.','কৃষক কষ্ট পাওয়ার আগেই আয় করুক।')}</p></div>
<div class="card"><label for="ph">📱 ${L('Phone number','ফোন নম্বর')}</label><input id="ph" inputmode="tel" value="${S.phone}">
<button class="btn" onclick="login('farmer')">${L('Continue as farmer','কৃষক হিসেবে চালু করুন')}</button><p class="mut">${L('Demo: no OTP needed. A real SMS code goes here.','ডেমো: ওটিপি লাগবে না। এখানে এসএমএস কোড আসবে।')}</p></div>
<div class="card"><h3>${L('Other demo views','অন্য ভিউ')}</h3><div style="display:flex;gap:10px"><button class="btn sm alt" onclick="login('buyer')">🏢 ${L('Buyer','ক্রেতা')}</button><button class="btn sm alt" onclick="login('admin')">📊 ${L('Partner admin','পার্টনার অ্যাডমিন')}</button></div></div></main>`;
V.home=()=>{const a=S.plans[0],w=API.weather[0];
 return`<main>${bridge()}
${w?`<div class="card" style="border-color:var(--bad)"><div style="display:flex;gap:10px"><span style="font-size:34px">${w.ic}</span><div><b>${L(w.en,w.bn)}</b><div class="mut">${L(w.den,w.dbn)}</div></div></div></div>`:''}
${a?`<div class="card"><h3>${API.crops[a.crop].ic} ${cn(a.crop)} · ${a.land} ${L('bigha','বিঘা')} · ${a.dist}</h3><div class="row"><span>${L('Advance','অগ্রিম')}</span><b>${a.status==='offer'?`<span class="pill w">${L('Offer waiting','অফার অপেক্ষায়')}</span>`:a.status==='active'?fmt(a.adv)+' <span class="pill">'+L('Active','চালু')+'</span>':'<span class="pill">'+L('Repaid','শোধ')+'</span>'}</b></div><div class="row"><span>${L('Harvest','ফসল তোলা')}</span><b>${a.date}</b></div>${a.status==='offer'?`<button class="btn" onclick="S.cur=S.plans[0];go('offer')">${L('See offer','অফার দেখুন')}</button>`:''}</div>
${guideCard(a.crop)}`:`<div class="card" style="text-align:center"><div style="font-size:46px">🌱</div><h3>${L('Start with your first crop plan','প্রথম ফসলের পরিকল্পনা দিয়ে শুরু করুন')}</h3><button class="btn" onclick="go('plan')">＋ ${L('Add crop plan','ফসলের পরিকল্পনা দিন')}</button></div>`}
<div class="grid"><button class="tile" onclick="go('market')"><span>🧺</span>${L('Sell crop','ফসল বিক্রি')}</button><button class="tile" onclick="go('dealers')"><span>🏪</span>${L('Input shops','সার-বীজের দোকান')}</button><button class="tile" onclick="go('women')"><span>👩‍🌾</span>${L('Women farmers','নারী কৃষক')}</button><button class="tile" onclick="go('plans')"><span>⭐</span>${L('Plans','প্যাকেজ')}</button></div></main>`};
function guideCard(k){const g=guide(k),c=API.crops[k],tx=g.up?L('Wait. Price may rise '+g.pct+'% in 3 weeks.','অপেক্ষা করুন। ৩ সপ্তাহে দাম '+g.pct+'% বাড়তে পারে।'):L('Sell now. Price may fall in 3 weeks.','এখনই বিক্রি করুন। ৩ সপ্তাহে দাম কমতে পারে।');
 return`<div class="card"><h3>🤖 ${L('Price guide','দামের পরামর্শ')} · ${c.ic} ${c[S.lang]}</h3><div class="row"><span class="mut">${L('Today per 40 kg','আজকের দাম, ৪০ কেজি')}</span><b class="big">${fmt(g.cur)}</b></div>${spark(k)}<div class="mut" style="display:flex;justify-content:space-between"><span>${L('Past 6 weeks','গত ৬ সপ্তাহ')}</span><span style="color:var(--gold)">${L('Forecast','পূর্বাভাস')} ${fmt(g.fc)}</span></div>
<div class="pill ${g.up?'w':''}" style="font-size:18px;margin-top:8px;padding:8px 14px">${g.up?'⏳':'✅'} ${tx}</div> <button class="btn sm alt" style="margin-top:8px;width:100%" onclick="say('${tx.replace(/'/g,'')}')">🔊 ${L('Listen','শুনুন')}</button></div>`}
V.plan=()=>{const d=new Date();d.setDate(d.getDate()+100);const dd=d.toISOString().slice(0,10);return`<main><h2>🌱 ${L('New crop plan','নতুন ফসলের পরিকল্পনা')}</h2><div class="card"><label>${L('Crop','ফসল')}</label><div class="grid">${Object.keys(API.crops).map(k=>`<button class="tile cp ${(S.pc||'rice')===k?'on':''}" data-k="${k}" onclick="pick('${k}')"><span>${API.crops[k].ic}</span>${cn(k)}</button>`).join('')}</div>
<label for="land">📏 ${L('Land (bigha)','জমি (বিঘা)')}</label><input id="land" type="number" inputmode="numeric" value="5"><label for="dist">📍 ${L('District','জেলা')}</label><select id="dist">${API.dists.map(x=>`<option>${x}</option>`).join('')}</select><label for="hd">📅 ${L('Expected harvest','ফসল তোলার সম্ভাব্য তারিখ')}</label><input id="hd" type="date" value="${dd}">
<label style="display:flex;gap:10px;align-items:center"><input id="wm" type="checkbox" style="width:28px;min-height:28px"> 👩‍🌾 ${L('Woman farmer or co-op','নারী কৃষক বা সমবায়')}</label></div><button class="btn" onclick="savePlan()">${L('Check my offer','আমার অফার দেখুন')}</button></main>`};
V.offer=()=>{const p=S.cur;return`<main><h2>💰 ${L('Your advance offer','আপনার অগ্রিম অফার')}</h2><div class="card" style="display:flex;gap:14px;align-items:center"><div class="score">${p.score}</div><div><b>${L('Risk score','ঝুঁকির স্কোর')}: ${p.score>=80?L('Low risk','কম ঝুঁকি'):p.score>=70?L('Medium','মাঝারি'):L('Watch','নজরদারি')}</b><div class="mut">${API.crops[p.crop].ic} ${cn(p.crop)} · ${p.land} ${L('bigha','বিঘা')} · ${p.dist}</div><span class="pill">✔ ${L('Data verified','তথ্য যাচাই হয়েছে')}</span></div></div>
<div class="card"><div class="row"><span>${L('Advance amount','অগ্রিমের পরিমাণ')}</span><b>${fmt(p.adv)}</b></div><div class="row"><span>${L('Service fee','সার্ভিস ফি')} (${p.pct}%)</span><b style="color:var(--bad)">− ${fmt(p.fee)}</b></div><div class="row"><span>${L('You receive today','আজ হাতে পাবেন')}</span><b class="big" style="color:var(--g)">${fmt(p.net)}</b></div><div class="row"><span>${L('You repay','শোধ করবেন')}</span><b>${fmt(p.rep)}</b></div><div class="row"><span>${L('Repay by','শোধের তারিখ')}</span><b>${p.repDate}</b></div><p class="mut">${L('One fixed fee. No hidden interest. No commission on your sale.','একটাই নির্দিষ্ট ফি। লুকানো সুদ নেই। বিক্রিতে কোনো কমিশন নেই।')}</p></div>
<button class="btn alt" onclick="say('${L('Advance '+p.adv+' taka. Fee '+p.fee+' taka. You receive '+p.net+' taka. Repay by '+p.repDate,p.adv+' taka advance. fee '+p.fee+' taka. apni pabén '+p.net+' taka')}')">🔊 ${L('Read aloud','পড়ে শোনান')}</button><button class="btn" onclick="accept()">✔ ${L('Accept advance','অগ্রিম নিন')}</button><button class="btn bad" onclick="go('home')">${L('Not now','এখন না')}</button></main>`};
V.market=()=>{const act=S.plans.filter(p=>p.status!=='offer');
 const lst=S.listings.map(l=>`<div class="card"><h3>${API.crops[l.crop].ic} ${cn(l.crop)} · ${l.qty} ${L('maund','মণ')}</h3><div class="mut">${L('Your price','আপনার দাম')}: ${fmt(l.ask)} / ${L('maund','মণ')} · ${l.dist}</div>
 ${l.sold?settle(l):l.offers.length?l.offers.map(o=>offerRow(l,o)).join(''):`<p class="mut">⏳ ${L('Waiting for verified buyers…','যাচাই করা ক্রেতার অপেক্ষায়…')}</p>`}</div>`).join('');
 return`<main><h2>🧺 ${L('Marketplace','বাজার')}</h2>${act.length?`<div class="card"><h3>${L('List your crop','ফসল তালিকায় দিন')}</h3><label for="lp">${L('Crop plan','ফসলের পরিকল্পনা')}</label><select id="lp" onchange="const c=API.crops[S.plans.find(x=>x.id==this.value).crop];$('ask').value=c.pr">${act.map(p=>`<option value="${p.id}">${cn(p.crop)} · ${p.land} ${L('bigha','বিঘা')}</option>`).join('')}</select><label for="qty">${L('Quantity (maund)','পরিমাণ (মণ)')}</label><input id="qty" type="number" value="${act[0].land*API.crops[act[0].crop].y}"><label for="ask">${L('Your price per maund (BDT)','প্রতি মণ আপনার দাম (টাকা)')}</label><input id="ask" type="number" value="${API.crops[act[0].crop].pr}"><button class="btn" onclick="mkListing()">${L('List crop','ফসল তালিকায় দিন')}</button></div>`:`<div class="card"><p>${L('Accept an advance offer first to list your crop.','ফসল তালিকায় দিতে আগে অগ্রিম অফার নিন।')}</p><button class="btn" onclick="go('${S.plans.length?'home':'plan'}')">${L('Go','যান')}</button></div>`}${lst}</main>`};
const offerRow=(l,o)=>`<div class="row" style="flex-direction:column"><div style="display:flex;justify-content:space-between"><b>${o.b.n} <span class="pill">✔ ${L('Verified','যাচাইকৃত')}</span></b></div><div class="big">${fmt(o.price)} <span class="mut">/ ${L('maund','মণ')} · ${o.qty}</span></div>${o.st==='new'?`<div style="display:flex;gap:10px"><button class="btn sm" onclick="decide('${l.id}','${o.id}',1)">✔ ${L('Accept','নিন')}</button><button class="btn sm bad" onclick="decide('${l.id}','${o.id}',0)">✖ ${L('Reject','না')}</button></div>`:`<span class="pill ${o.st==='accepted'?'':'r'}">${o.st==='accepted'?L('Accepted','গৃহীত'):L('Rejected','বাতিল')}</span>`}</div>`;
const settle=l=>{const o=l.sold,g=o.price*o.qty,p=S.plans.find(x=>x.id===l.plan),rp=p?p.rep:0;return`<div style="background:var(--g2);border-radius:12px;padding:12px"><b>🎉 ${L('Deal confirmed with','চুক্তি হয়েছে')} ${o.b.n}</b><div class="row"><span>${L('Sale total','মোট বিক্রি')}</span><b>${fmt(g)}</b></div><div class="row"><span>${L('Commission','কমিশন')}</span><b>৳0</b></div><div class="row"><span>${L('Advance repaid','অগ্রিম শোধ')}</span><b>− ${fmt(rp)}</b></div><div class="row"><span>${L('You keep','আপনি পাবেন')}</span><b class="big" style="color:var(--g)">${fmt(g-rp)}</b></div></div>`};
V.weather=()=>`<main><h2>🌦️ ${L('Weather alerts','আবহাওয়ার সতর্কতা')}</h2>${API.weather.map(w=>`<div class="card" style="border-color:${w.s==='r'?'var(--bad)':'var(--bd)'}"><div style="display:flex;gap:12px"><span style="font-size:38px">${w.ic}</span><div><b>${L(w.en,w.bn)}</b><div class="mut">${L(w.den,w.dbn)}</div><span class="pill ${w.s==='r'?'r':w.s==='w'?'w':''}">${w.s==='r'?L('High','জরুরি'):w.s==='w'?L('Medium','মাঝারি'):L('Info','তথ্য')}</span></div></div></div>`).join('')}<p class="mut">📩 ${L('Same alerts go by SMS to your phone.','একই সতর্কতা এসএমএসে ফোনে আসবে।')}</p></main>`;
V.plans=()=>{const P=[['Basic','৳50–100',['📖 '+L('Dealer directory','ডিলার তালিকা')]],['Pro','৳200–300',['🧺 '+L('Full marketplace','পুরো বাজার'),'🤖 '+L('AI price tools','এআই দামের পরামর্শ')]],['Premium','৳400–500',['💰 '+L('Advance financing','অগ্রিম অর্থায়ন'),'🎧 '+L('Dedicated support','নিজস্ব সহায়তা'),'⚡ '+L('Early buyer access','আগে ক্রেতার সুযোগ'),'📑 '+L('Custom market reports','বাজার রিপোর্ট'),'📦 '+L('Bulk input coordination','একসাথে সার-বীজ কেনা')]]];
 return`<main><h2>⭐ ${L('Plans','প্যাকেজ')}</h2>${P.map(x=>`<div class="card" style="${S.sub===x[0]?'border-color:var(--g);background:var(--g2)':''}"><div style="display:flex;justify-content:space-between"><h3>${x[0]}</h3><b class="big" style="font-size:22px">${x[1]}<span class="mut" style="font-size:14px">/${L('mo','মাস')}</span></b></div>${x[2].map(f=>`<div class="row">${f}</div>`).join('')}<button class="btn ${S.sub===x[0]?'alt':''}" onclick="S.sub='${x[0]}';toast('${x[0]} ✔');render()">${S.sub===x[0]?L('Current plan','বর্তমান প্যাকেজ'):L('Choose','বেছে নিন')}</button></div>`).join('')}<p class="mut">${L('Fixed fee. Zero commission on trades.','নির্দিষ্ট ফি। বিক্রিতে শূন্য কমিশন।')}</p></main>`};
V.dealers=()=>`<main><h2>🏪 ${L('Input shops','সার-বীজের দোকান')}</h2>${[...API.dealers].sort((a,b)=>b.f-a.f).map(d=>`<div class="card"><div style="display:flex;justify-content:space-between"><h3>${d.n}</h3>${d.f?`<span class="pill w">★ ${L('Featured','ফিচার্ড')}</span>`:''}</div><div class="mut">📍 ${d.d} · ${d.i}</div><button class="btn sm alt" style="width:100%;margin-top:8px">📞 ${L('Call','কল করুন')}</button></div>`).join('')}</main>`;
V.women=()=>`<main><h2>👩‍🌾 ${L('Women farmers','নারী কৃষক')}</h2><div class="card"><p>${L('A simple path for women farmers and cooperatives.','নারী কৃষক ও সমবায়ের জন্য সহজ পথ।')}</p>${[['📱',L('Register with your phone. No land papers needed to start.','ফোন নম্বরে নিবন্ধন করুন। শুরুতে জমির কাগজ লাগবে না।')],['🤝',L('Join as a group. A field agent visits your co-op.','দলে যোগ দিন। মাঠ কর্মী সমবায়ে আসবেন।')],['💰',L('Get an advance offer with the same fixed fee.','একই নির্দিষ্ট ফিতে অগ্রিম অফার পান।')],['🧺',L('Sell direct to verified buyers.','যাচাই করা ক্রেতার কাছে সরাসরি বিক্রি করুন।')]].map(x=>`<div class="row"><span style="font-size:28px">${x[0]}</span><span style="flex:1">${x[1]}</span></div>`).join('')}</div><button class="btn" onclick="go('plan')">${L('Start as woman farmer','নারী কৃষক হিসেবে শুরু করুন')}</button></main>`;
V.more=()=>`<main><h2>${L('More','আরও')}</h2><div class="grid"><button class="tile" onclick="go('plans')"><span>⭐</span>${L('Plans','প্যাকেজ')}</button><button class="tile" onclick="go('dealers')"><span>🏪</span>${L('Input shops','দোকান')}</button><button class="tile" onclick="go('women')"><span>👩‍🌾</span>${L('Women','নারী কৃষক')}</button><button class="tile" onclick="theme()"><span>🌓</span>${L('Contrast','রং')}</button><button class="tile" onclick="S.role=null;go('login')"><span>🚪</span>${L('Switch user','ব্যবহারকারী বদল')}</button></div></main>`;
V.browse=()=>{const all=S.blist.concat(S.listings);return`<main><h2>🏢 ${L('Open listings','খোলা তালিকা')}</h2><label>${L('Offering as','অফার দিচ্ছেন')}</label><select onchange="S.bsel=this.value">${API.buyers.map(b=>`<option value="${b.id}" ${S.bsel===b.id?'selected':''}>${b.n}</option>`).join('')}</select><div style="height:12px"></div>${all.map(l=>`<div class="card"><h3>${API.crops[l.crop].ic} ${cn(l.crop)} · ${l.qty} ${L('maund','মণ')}</h3><div class="mut">👤 ${l.farmer} · 📍 ${l.dist}</div><div class="big">${fmt(l.ask)} <span class="mut">/ ${L('maund','মণ')}</span></div><div style="display:flex;gap:10px;margin-top:8px"><button class="btn sm" onclick="sendOffer('${l.id}',0)">${L('Offer at ask','দামে অফার')}</button><button class="btn sm alt" onclick="sendOffer('${l.id}',3)">− 3%</button></div>${l.offers.length?`<div class="mut">${l.offers.length} ${L('offer(s) sent','অফার পাঠানো')}</div>`:''}</div>`).join('')}</main>`};
V.bprofile=()=>{const b=API.buyers.find(x=>x.id===S.bsel);return`<main><h2>${L('Buyer profile','ক্রেতার প্রোফাইল')}</h2><div class="card" style="text-align:center"><div style="font-size:54px">🏢</div><h3>${b.n}</h3><span class="pill" style="font-size:17px">✔ ${L('Verified buyer','যাচাইকৃত ক্রেতা')}</span><div class="row"><span>${L('Type','ধরন')}</span><b>${b.t}</b></div><div class="row"><span>${L('Base','অবস্থান')}</span><b>${b.d}</b></div><div class="row"><span>${L('Trade licence','ট্রেড লাইসেন্স')}</span><b>✔</b></div><div class="row"><span>${L('Payment record','পেমেন্টের রেকর্ড')}</span><b>98% ${L('on time','সময়মতো')}</b></div></div></main>`};
V.admin=()=>{const m=API.mix,paid=Object.values(m).reduce((a,x)=>a+x[0],0),mrr=Object.values(m).reduce((a,x)=>a+x[0]*x[1],0),adv=S.plans.filter(p=>p.status!=='offer').reduce((a,p)=>a+p.adv,0)+41800000;
 return`<main><h2>📊 ${L('Partner dashboard','পার্টনার ড্যাশবোর্ড')}</h2><div class="grid"><div class="card"><div class="mut">${L('Farmers','কৃষক')}</div><div class="big">12,480</div></div><div class="card"><div class="mut">${L('Paid subscribers','পেইড সাবস্ক্রাইবার')}</div><div class="big">${paid.toLocaleString('en-IN')}</div></div><div class="card"><div class="mut">${L('Advances issued','অগ্রিম দেওয়া হয়েছে')}</div><div class="big" style="font-size:22px">${fmt(adv)}</div></div><div class="card"><div class="mut">MRR</div><div class="big" style="font-size:22px">${fmt(mrr)}</div></div></div>
<div class="card"><h3>${L('Subscription mix','সাবস্ক্রিপশন মিশ্রণ')}</h3>${Object.entries(m).map(([k,x],i)=>`<div style="margin-top:8px"><div style="display:flex;justify-content:space-between"><span>${k}</span><b>${x[0]}</b></div><div class="bar ${['','s','t'][i]}" style="width:${x[0]/paid*100}%"></div></div>`).join('')}</div>
<div class="card"><div class="row"><span>${L('Data revenue / month','ডেটা থেকে আয় / মাস')}</span><b>${fmt(API.dataRev)}</b></div><div class="row"><span>${L('Trade commission','ট্রেড কমিশন')}</span><b>৳0</b></div></div><button class="btn alt" onclick="S.role=null;go('login')">${L('Back','ফিরে যান')}</button></main>`};

function nav(){const N=S.role==='farmer'?[['home','🏠',L('Home','হোম')],['plan','🌱',L('Plan','পরিকল্পনা')],['market','🧺',L('Market','বাজার')],['weather','🌦️',L('Weather','আবহাওয়া')],['more','☰',L('More','আরও')]]:S.role==='buyer'?[['browse','🧺',L('Listings','তালিকা')],['bprofile','✔',L('Profile','প্রোফাইল')],['login','🚪',L('Switch','বদল')]]:[];
  return N.length?`<nav>${N.map(n=>`<button class="${S.view===n[0]?'on':''}" onclick="${n[0]==='login'?"S.role=null;":''}go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`:''}
function render(){const v=V[S.view]?S.view:'home';$('app').innerHTML=`<header><b>🌾 FosolSetu</b><button onclick="lang()" aria-label="Language">${S.lang==='bn'?'EN':'বাংলা'}</button></header>${S.toast?`<div class="toast">${S.toast}</div>`:''}${V[v]()}${nav()}`}
render();
</script></body></html>
